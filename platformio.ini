; ============================================================
;  CYD Cinema — Recomendador de películas estilo Letterboxd
;  Placa: ESP32-2432S028 (CYD 2.8" ST7789 + XPT2046 Touch)
; ============================================================

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partición con más espacio para la app (1.9 MB APP / 190 KB SPIFFS)
board_build.partitions = min_spiffs.csv

build_flags =
    -DUSER_SETUP_LOADED=1
    ; Driver de la pantalla (ST7789 confirmado en tu hardware)
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    
    ; Pines de la pantalla TFT (VSPI)
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; Fuentes para textos elegantes
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    
    ; Velocidad SPI de pantalla
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
